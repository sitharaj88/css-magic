<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Loading Animation | CSS Magic</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a1a;
      font-family: 'Space Grotesk', sans-serif;
      overflow: hidden;
    }

    /* ========== BACKGROUND ========== */
    .bg {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 50% 40%, rgba(6, 182, 212, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 30% 70%, rgba(168, 85, 247, 0.06) 0%, transparent 40%),
        #0a0a1a;
      z-index: -1;
    }

    /* ========== LOADER CONTAINER ========== */
    .loader-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    /* ========== THE ORB ========== */
    .orb {
      position: relative;
      width: 150px;
      height: 150px;
      border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      background: linear-gradient(
        135deg,
        #06b6d4 0%,
        #8b5cf6 50%,
        #ec4899 100%
      );
      background-size: 200% 200%;
      animation: 
        morph 8s ease-in-out infinite,
        colorShift 6s ease-in-out infinite,
        float 3s ease-in-out infinite;
      box-shadow:
        0 0 60px rgba(6, 182, 212, 0.4),
        0 0 100px rgba(139, 92, 246, 0.3),
        inset 0 0 40px rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    /* Morphing animation */
    @keyframes morph {
      0%, 100% {
        border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      }
      25% {
        border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%;
      }
      50% {
        border-radius: 50% 60% 30% 60% / 30% 40% 70% 50%;
      }
      75% {
        border-radius: 40% 50% 60% 50% / 60% 50% 40% 60%;
      }
    }

    /* Color cycling */
    @keyframes colorShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* Floating motion */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* ========== INTERNAL WAVES ========== */
    .wave {
      position: absolute;
      width: 200%;
      height: 200%;
      top: 50%;
      left: -50%;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 40%;
      animation: wave 4s linear infinite;
    }

    .wave-1 {
      animation-duration: 4s;
    }

    .wave-2 {
      animation-duration: 5s;
      animation-delay: -2s;
      background: rgba(255, 255, 255, 0.1);
    }

    .wave-3 {
      animation-duration: 6s;
      animation-delay: -4s;
      background: rgba(255, 255, 255, 0.08);
    }

    @keyframes wave {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ========== BUBBLES ========== */
    .bubble {
      position: absolute;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      animation: rise 3s ease-in infinite;
    }

    .bubble-1 {
      width: 8px; height: 8px;
      left: 30%; bottom: 20%;
      animation-duration: 2.5s;
    }

    .bubble-2 {
      width: 5px; height: 5px;
      left: 50%; bottom: 15%;
      animation-duration: 3s;
      animation-delay: 0.5s;
    }

    .bubble-3 {
      width: 6px; height: 6px;
      left: 65%; bottom: 25%;
      animation-duration: 2.8s;
      animation-delay: 1s;
    }

    @keyframes rise {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0.6;
      }
      50% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-80px) scale(0.5);
        opacity: 0;
      }
    }

    /* ========== DRIP EFFECT ========== */
    .drip-container {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
    }

    .drip {
      width: 12px;
      height: 12px;
      background: linear-gradient(135deg, #06b6d4, #8b5cf6);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      animation: drip 2s ease-in infinite;
      opacity: 0;
    }

    @keyframes drip {
      0% {
        transform: translateY(0) scale(0.5);
        opacity: 0;
      }
      10% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      50% {
        transform: translateY(60px) scale(0.8);
        opacity: 1;
      }
      100% {
        transform: translateY(80px) scale(0);
        opacity: 0;
      }
    }

    /* ========== REFLECTION ========== */
    .reflection {
      position: absolute;
      bottom: -100px;
      width: 120px;
      height: 60px;
      background: linear-gradient(
        to bottom,
        rgba(6, 182, 212, 0.15) 0%,
        transparent 100%
      );
      border-radius: 50%;
      filter: blur(10px);
      animation: reflectionPulse 3s ease-in-out infinite;
    }

    @keyframes reflectionPulse {
      0%, 100% { 
        transform: scaleX(1);
        opacity: 0.6;
      }
      50% { 
        transform: scaleX(1.1);
        opacity: 0.4;
      }
    }

    /* ========== LOADING TEXT ========== */
    .loading-text {
      font-size: 1.2rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.8);
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(6, 182, 212, 0.5);
      animation: textPulse 2s ease-in-out infinite;
    }

    @keyframes textPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* ========== DOTS ========== */
    .dots {
      display: inline-flex;
      gap: 4px;
      margin-left: 5px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      animation: dotBounce 1.4s ease-in-out infinite;
    }

    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotBounce {
      0%, 80%, 100% {
        transform: scale(0.6);
        opacity: 0.4;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* ========== TITLE ========== */
    h1 {
      position: fixed;
      top: 40px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: 6px;
      text-transform: uppercase;
    }

    /* ========== GLOW RINGS ========== */
    .glow-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(6, 182, 212, 0.2);
      animation: expandRing 3s ease-out infinite;
      pointer-events: none;
    }

    .glow-ring-1 {
      width: 180px; height: 180px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }

    .glow-ring-2 {
      width: 180px; height: 180px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: 1s;
    }

    .glow-ring-3 {
      width: 180px; height: 180px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: 2s;
    }

    @keyframes expandRing {
      0% {
        width: 150px; height: 150px;
        opacity: 0.6;
      }
      100% {
        width: 300px; height: 300px;
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="bg"></div>

  <h1>Liquid Loader</h1>

  <div class="loader-container">
    
    <!-- Expanding glow rings -->
    <div class="glow-ring glow-ring-1"></div>
    <div class="glow-ring glow-ring-2"></div>
    <div class="glow-ring glow-ring-3"></div>

    <!-- Main orb -->
    <div class="orb">
      <div class="wave wave-1"></div>
      <div class="wave wave-2"></div>
      <div class="wave wave-3"></div>
      <div class="bubble bubble-1"></div>
      <div class="bubble bubble-2"></div>
      <div class="bubble bubble-3"></div>
    </div>

    <!-- Drip effect -->
    <div class="drip-container">
      <div class="drip"></div>
    </div>

    <!-- Floor reflection -->
    <div class="reflection"></div>

    <!-- Loading text -->
    <div class="loading-text">
      Loading
      <span class="dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </span>
    </div>

  </div>

</body>
</html>
