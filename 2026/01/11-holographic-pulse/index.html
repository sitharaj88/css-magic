<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holographic Geometric Pulse | CSS Magic</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="hologram-viewport">
    <!-- Digital Overlay -->
    <div class="vignette"></div>
    <div class="scanlines"></div>
    <div class="noise"></div>

    <header>
      <div class="logo">HOLOGRAPHIC_SYS_v4.0</div>
      <div class="status">PULSE_INIT_ACTIVE</div>
    </header>

    <main>
      <div class="hologram-stage">
        <!-- 3D Wireframe Geometry -->
        <div class="wireframe-container">
          <div class="cube">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>

            <!-- Internal Accents -->
            <div class="inner-cube"></div>
          </div>
        </div>

        <!-- Digital Pulse Core -->
        <div class="pulse-core">
          <div class="core-wave"></div>
          <div class="core-wave"></div>
          <div class="core-wave"></div>
        </div>

        <!-- Data Rings -->
        <div class="data-ring outer"></div>
        <div class="data-ring inner"></div>

        <!-- Progress HUD -->
        <div class="hud-container">
          <div class="hud-line"></div>
          <div class="progress-data">
            <span class="label">UPLOADING_CORE_DATA</span>
            <span class="percentage">00%</span>
          </div>
          <div class="binary-stream">010110 110010 001101 101010</div>
        </div>
      </div>
    </main>

    <footer>
      <div class="coord-tag">X: 124.5 Y: 890.1 Z: 0.003</div>
      <div class="brand-tag">CSS_MAGIC_EXP_2026</div>
    </footer>
  </div>
</body>

</html>
